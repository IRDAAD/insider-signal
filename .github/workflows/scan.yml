name: Daily insider scan

# SEC blocks some GitHub runner IPs (shared, burned by other scrapers).
# Each run gets a DIFFERENT runner, so we try several times each morning.
# The scanner refuses to overwrite good data with a blocked/empty run,
# so the first success wins and later attempts are harmless.
on:
  schedule:
    - cron: "15 11 * * 2-6"   # 7:15 AM ET
    - cron: "45 11 * * 2-6"   # 7:45 AM ET
    - cron: "15 12 * * 2-6"   # 8:15 AM ET
    - cron: "45 12 * * 2-6"   # 8:45 AM ET
    - cron: "15 13 * * 2-6"   # 9:15 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the scanner
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python3 scripts/scanner.py

      - name: Commit results if anything changed
        run: |
          git config user.name  "insider-signal-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add -A alerts.json
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M)"
            git push
            echo "Committed new results."
          fi

      - name: Upload alerts.json
        if: hashFiles('alerts.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ github.run_number }}
          path: alerts.json
          retention-days: 30
