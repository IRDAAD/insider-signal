name: Daily insider scan

# SEC blocks by IP reputation. Ubuntu runners (Azure) are heavily burned by
# other scrapers. macOS runners sit on a different IP range and are free on
# public repos - so we try macOS first, Ubuntu as a backup.
# Each run also lands on a different machine, so we try several times a
# morning. The scanner never overwrites good data with a blocked run.
on:
  schedule:
    - cron: "15 11 * * 2-6"   # 7:15 AM ET
    - cron: "45 11 * * 2-6"   # 7:45 AM ET
    - cron: "15 12 * * 2-6"   # 8:15 AM ET
    - cron: "45 12 * * 2-6"   # 8:45 AM ET
    - cron: "15 13 * * 2-6"   # 9:15 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: macos-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run the scanner
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python3 scripts/scanner.py

      - name: Commit results if anything changed
        run: |
          git config user.name  "insider-signal-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add -A alerts.json
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M)"
            git push
            echo "Committed new results."
          fi

      - name: Upload alerts.json
        if: hashFiles('alerts.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ github.run_number }}
          path: alerts.json
          retention-days: 30
