name: Daily insider scan

# Runs every weekday morning. Cron is UTC.
# 11:15 UTC = 7:15 AM Eastern (EDT) / 6:15 AM (EST).
# SEC posts the previous day's index overnight, so this catches it.
on:
  schedule:
    - cron: "15 11 * * 2-6"   # Tue-Sat UTC = Mon-Fri filings
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to commit alerts.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the scanner
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          python3 scripts/scanner.py
          echo "--- result ---"
          python3 -c "import json;d=json.load(open('alerts.json'));print(d['scan_date'], len(d['alerts']), 'qualifying buys')"

      - name: Commit results if anything changed
        run: |
          git config user.name  "insider-signal-bot"
          git config user.email "actions@github.com"
          git add alerts.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload alerts.json as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ github.run_number }}
          path: alerts.json
          retention-days: 30
